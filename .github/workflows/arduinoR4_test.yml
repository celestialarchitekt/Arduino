name: Arduino CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PATH: $HOME/.arduino15/bin:$PATH

    steps:
      - uses: actions/checkout@v4

      - name: Debug tar availability
        run: |
          which tar
          tar --version
          echo "PATH=$PATH"

      - name: Install tar if missing (safe fallback)
        run: |
          if ! command -v tar &> /dev/null
          then
            sudo apt-get update
            sudo apt-get install -y tar
          else
            echo "tar is already installed"
          fi
          

   
