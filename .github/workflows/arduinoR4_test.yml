name: Arduino CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites (jq for fallback)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install Arduino CLI into ~/.arduino15/bin (with fallback)
        run: |
          set -e
          mkdir -p "$HOME/.arduino15/bin"
          export BINDIR="$HOME/.arduino15/bin"
          # Primary install via official script
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh

          echo "Contents of $HOME/.arduino15/bin after install:"
          ls -l "$HOME/.arduino15/bin"

          # Fallback: if arduino-cli missing or not executable, fetch latest release
          if [ ! -x "$HOME/.arduino15/bin/arduino-cli" ]; then
            echo "arduino-cli not found or not executable; fetching latest release directly"
            ARCH=amd64
            OS=linux
            VERSION=$(curl -s https://api.github.com/repos/arduino/arduino-cli/releases/latest | jq -r .tag_name)
            curl -L "https://github.com/arduino/arduino-cli/releases/download/${VERSION}/arduino-cli_${VERSION#v}_${OS}_${ARCH}.tar.gz" | tar -xz -C "$HOME/.arduino15/bin" --strip-components=1
          fi

          chmod +x "$HOME/.arduino15/bin/arduino-cli"
          echo "$HOME/.arduino15/bin" >> $GITHUB_PATH

      - name: Verify arduino-cli is available
        run: |
          which arduino-cli
          arduino-cli version

      - name: Update Arduino Core Index
        run: arduino-cli core update-index

      - name: Install Arduino Core for Uno R4 Wifi
        run: arduino-cli core install arduino:renesas_uno

      - name: Compile all sketches
        run: |
          set -e
          for sketch in ./sketch_*; do
            echo "=== Compiling $sketch ==="
            arduino-cli compile --fqbn arduino:renesas_uno:unor4wifi "$sketch"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: compiled-sketches
          path: |
            ./sketch_*/build
