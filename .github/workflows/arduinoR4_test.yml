name: Arduino CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI into ~/.arduino15/bin
        run: |
          mkdir -p "$HOME/.arduino15/bin"
          BINDIR=$HOME/.arduino15/bin curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$HOME/.arduino15/bin" >> $GITHUB_PATH

      - name: Verify arduino-cli is on PATH
        run: |
          which arduino-cli
          arduino-cli version

      - name: Update Arduino Core Index
        run: arduino-cli core update-index

      - name: Install Arduino Core for Uno R4 Wifi
        run: arduino-cli core install arduino:megaavr

      - name: Compile all sketches
        run: |
          set -e
          for sketch in ./sketch_*; do
            echo "Compiling $sketch"
            arduino-cli compile --fqbn arduino:megaavr:unoR4wifi "$sketch"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: compiled-sketches
          path: |
            ./sketch_*/build
